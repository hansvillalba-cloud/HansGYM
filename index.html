 ciclismo:{A:['squat','hinge','bridge','core'],B:['pull','push','press','core'],C:['cardio','lunge','bridge','core'],D:['lunge','hinge','pull','bridge'],E:['cardio','squat','press','core']},

 masa:{A:['squat','push','pull','bridge'],B:['hinge','press','lunge','core'],C:['squat','pull','push','curl'],D:['lunge','hinge','press','pull'],E:['squat','bridge','push','press']},

 peso:{A:['squat','push','pull','cardio'],B:['hinge','lunge','press','core'],C:['cardio','squat','bridge','push'],D:['pull','lunge','cardio','core'],E:['hinge','push','cardio','press']},
 forma:{A:['squat','push','pull','core'],B:['hinge','lunge','press','bridge'],C:['cardio','squat','pull','core'],D:['lunge','pull','hinge','core'],E:['cardio','bridge','press','push']},
 fuerza:{A:['squat','push','pull','core'],B:['hinge','press','lunge','bridge'],C:['squat','pull','push','hinge'],D:['lunge','hinge','press','pull'],E:['bridge','squat','press','push']}
};
const E=[];
function add(id,name,gear,pattern,art,cam,cues){E.push({id,name,gear,pattern,art,cam,cues});}
add('squat_bw','Sentadilla al aire','corporal','squat','squat','squat',['Separa los pies al ancho de los hombros y apoya todo el pie.','Lleva la cadera atrás y baja hasta un rango cómodo.','Empuja el suelo y vuelve a subir sin perder el equilibrio.']);
add('squat_band','Sentadilla con banda','bandas','squat','squat','squat',['Pisa la banda de forma estable y sujeta sus extremos.','Flexiona caderas y rodillas con control.','Extiende las piernas sin que la banda se deslice.']);
add('squat_bar','Sentadilla con barra','barra','squat','squat','squat',['Usa un soporte apropiado y una carga que controles.','Apoya todo el pie y desciende hasta un rango cómodo.','Sube con control; si no tienes soporte, usa otra variante.']);
add('squat_db','Sentadilla con mancuerna','mancuernas','squat','squat','squat',['Sujeta una mancuerna cerca del pecho.','Flexiona caderas y rodillas, manteniendo los pies apoyados.','Vuelve a la posición inicial de forma controlada.']);
add('hinge_bw','Buenos días sin peso','corporal','hinge','hinge','hinge',['De pie, flexiona ligeramente las rodillas.','Lleva la cadera hacia atrás con la espalda en posición cómoda y neutra.','Contrae glúteos para volver a subir.']);
add('hinge_band','Peso muerto con banda','bandas','hinge','hinge','hinge',['Pisa la banda y sujeta sus extremos cerca de las piernas.','Lleva la cadera atrás sin encorvar deliberadamente la espalda.','Extiende la cadera y vuelve a subir.']);
add('hinge_bar','Peso muerto rumano con barra','barra','hinge','hinge','hinge',['Sujeta la barra cerca del cuerpo con las rodillas suavemente flexionadas.','Lleva la cadera atrás hasta sentir tensión cómoda en los muslos.','Vuelve arriba extendiendo la cadera, sin hiperextender la espalda.']);
add('hinge_db','Peso muerto rumano con mancuernas','mancuernas','hinge','hinge','hinge',['Sujeta las mancuernas frente a los muslos.','Lleva la cadera atrás con rodillas suaves y peso cercano al cuerpo.','Vuelve arriba de manera controlada.']);
add('bridge_bw','Puente de glúteos','corporal','bridge','bridge','bridge',['Acuéstate boca arriba con rodillas flexionadas y pies apoyados.','Eleva la cadera hasta alinear hombros, cadera y rodillas cómodamente.','Baja despacio sin empujar con el cuello.']);
add('bridge_band','Puente de glúteos con banda','bandas','bridge','bridge','bridge',['Coloca una banda adecuada por encima de las rodillas.','Con pies apoyados, eleva la cadera con control.','Desciende evitando que las rodillas colapsen hacia dentro.']);
add('bridge_bar','Puente de glúteos con barra','barra','bridge','bridge','bridge',['Coloca una barra acolchada sobre la cadera y pies firmes.','Eleva la pelvis de forma controlada sin arquear en exceso.','Baja suavemente y repite.']);
add('bridge_db','Puente de glúteos con mancuerna','mancuernas','bridge','bridge','bridge',['Sujeta una mancuerna sobre la cadera, con pies apoyados.','Eleva y baja la pelvis con control.','Mantén el cuello relajado.']);
add('lunge_bw','Zancada hacia atrás','corporal','lunge','lunge','lunge',['Da un paso atrás manteniendo el peso repartido.','Flexiona ambas rodillas hasta un rango cómodo.','Impúlsate con la pierna delantera y alterna lados.']);
add('lunge_band','Zancada con banda','bandas','lunge','lunge','lunge',['Pisa la banda con el pie delantero y sujeta los extremos.','Da un paso atrás y baja con control.','Regresa y realiza el mismo número por lado.']);
add('lunge_bar','Zancada con barra','barra','lunge','lunge','lunge',['Usa una carga ligera y espacio despejado.','Da un paso atrás con control y flexiona las rodillas.','Regresa a la posición inicial; alterna piernas.']);
add('lunge_db','Zancada con mancuernas','mancuernas','lunge','lunge','lunge',['Sujeta las mancuernas a los lados.','Da un paso hacia atrás y baja con control.','Regresa y alterna piernas.']);
add('push_bw','Flexiones con apoyo','corporal','push','push','push',['Apoya las manos en una pared o superficie firme; más baja implica mayor dificultad.','Mantén el cuerpo alineado y acerca el pecho al apoyo.','Empuja para volver, sin bloquear bruscamente los codos.']);
add('push_band','Press de pecho con banda','bandas','push','chestpress','press',['Coloca la banda alrededor de la espalda y sujeta ambos extremos.','Empuja las manos al frente desde el pecho.','Regresa lentamente manteniendo control de la banda.']);
add('push_bar','Press de pecho en el suelo con barra','barra','push','push','push',['Usa una carga segura y un soporte adecuado; pide ayuda si es necesario.','Acostado, flexiona los codos hasta rozar el suelo con los brazos.','Empuja hacia arriba sin perder control de la barra.']);
add('push_db','Press de pecho en el suelo con mancuernas','mancuernas','push','push','push',['Acuéstate con pies apoyados y mancuernas sobre el pecho.','Baja los brazos de forma controlada hasta rozar el suelo.','Empuja de vuelta sin golpear las mancuernas.']);
add('pull_bw','Ángeles boca abajo','corporal','pull','pull',null,['Acuéstate boca abajo con la frente cerca del suelo.','Eleva suavemente las manos y desplázalas de los lados hacia adelante.','Vuelve con control, sin forzar el cuello.']);
add('pull_band','Remo con banda','bandas','pull','seatedrow','row',['Siéntate con piernas extendidas y pasa la banda por las plantas de los pies.','Lleva los codos atrás mientras mantienes el torso estable.','Extiende los brazos lentamente.']);
add('pull_bar','Remo inclinado con barra','barra','pull','row','row',['Sostén la barra y lleva la cadera hacia atrás.','Con tronco estable, lleva la barra hacia el abdomen.','Baja la barra con control y sin tirones.']);
add('pull_db','Remo inclinado con mancuernas','mancuernas','pull','row','row',['Inclina el torso desde la cadera con rodillas suaves.','Lleva los codos hacia atrás cerca del cuerpo.','Baja las mancuernas de forma controlada.']);
add('press_bw','Press de hombros sin carga','corporal','press','press','press',['De pie, coloca las manos a la altura de los hombros.','Eleva los brazos en un rango cómodo.','Baja lentamente; mantén el abdomen activo.']);

  catch(err){if(!['OverconstrainedError','NotFoundError','DevicesNotFoundError'].includes(err?.name))throw err;newStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}

  const actual=stream.getVideoTracks?.()[0]?.getSettings?.().facingMode;cameraMirrored=(actual||cameraFacing)!=='environment';const v=$('#video');if(!v){newStream.getTracks().forEach(t=>t.stop());stream=null;cameraRunning=false;return}v.muted=true;v.playsInline=true;v.classList.toggle('mirrored',cameraMirrored);v.srcObject=stream;v.play().catch(()=>setCamStatus('Si no ves la imagen, toca la vista de cámara para reproducirla.'));
  if($('#cameraToggle')){$('#cameraToggle').disabled=false;$('#cameraToggle').textContent='Apagar cámara'}setCamStatus('Cámara encendida. Cargando el seguimiento corporal; necesitas internet.');startTracking(token);
 }catch(err){if(token!==cameraToken)return;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;cameraRunning=false;trackingReady=false;setCamStatus(cameraError(err));if($('#cameraToggle')){$('#cameraToggle').disabled=false;$('#cameraToggle').textContent='Reintentar cámara'}}
}
async function startTracking(token=cameraToken,forceCPU=false){
 if(!training||!cameraRunning||token!==cameraToken||trackingLoading===token)return;trackingLoading=token;trackingReady=false;const retry=$('#retryTracker');if(retry){retry.hidden=false;retry.disabled=true;retry.textContent='Cargando seguimiento…'}
 setCamStatus(forceCPU?'Ajustando el detector para este celular…':'Cámara encendida. Cargando el seguimiento corporal; necesitas internet.');
 try{const desired=training.partner?2:1;if(landmarker&&(modelPoses!==desired||forceCPU&&modelDelegate!=='CPU')){try{landmarker.close()}catch(e){}landmarker=null;modelPoses=0}
  if(!landmarker){const {PoseLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');const fs=await FilesetResolver.forVisionTasks(WASM);let created,delegate=forceCPU?'CPU':'GPU';try{created=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate},runningMode:'VIDEO',numPoses:desired})}catch(err){if(delegate==='CPU')throw err;delegate='CPU';created=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate},runningMode:'VIDEO',numPoses:desired})}
   if(token!==cameraToken||!cameraRunning||!training){try{created.close()}catch(e){}return}landmarker=created;modelPoses=desired;modelDelegate=delegate}
  if(token!==cameraToken||!cameraRunning||!training)return;trackingReady=true;lastFrame=-1;lastInferenceAt=0;resetDetection(training.current);if(training.partner)resetDetection(training.partner.current);setCamStatus(training.list[training.idx].cam?'Seguimiento listo. Ubícate según la guía y realiza el movimiento completo.':'Cámara lista. Esta actividad se registra con el botón o cronómetro.');if($('#retryTracker'))$('#retryTracker').hidden=true;if(cameraFrame)cancelAnimationFrame(cameraFrame);cameraFrame=requestAnimationFrame(cameraLoop);
 }catch(err){if(token!==cameraToken||!cameraRunning)return;trackingReady=false;setCamStatus('La cámara funciona, pero no se cargó el detector. Revisa internet y pulsa «Reintentar seguimiento».');if($('#retryTracker')){$('#retryTracker').hidden=false;$('#retryTracker').textContent='Reintentar seguimiento'}}
 finally{if(trackingLoading===token)trackingLoading=false;if($('#retryTracker'))$('#retryTracker').disabled=false}
}
function stopCamera(){cameraToken++;cameraRunning=false;trackingReady=false;trackingLoading=false;if(cameraFrame)cancelAnimationFrame(cameraFrame);cameraFrame=0;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const v=$('#video');if(v)v.srcObject=null;const canvas=$('#canvas');if(canvas)canvas.getContext('2d')?.clearRect(0,0,canvas.width,canvas.height);setCamStatus('Cámara apagada.');const b=$('#cameraToggle');if(b){b.disabled=false;b.textContent='Activar cámara'}const retry=$('#retryTracker');if(retry)retry.hidden=true;if(training){resetDetection(training.current);if(training.partner)resetDetection(training.partner.current)}}

function landmarkAngle(L,a,b,c){if(!L[a]||!L[b]||!L[c])return NaN;let A={x:L[a].x*aspect,y:L[a].y},B={x:L[b].x*aspect,y:L[b].y},C={x:L[c].x*aspect,y:L[c].y};let x=Math.abs((Math.atan2(C.y-B.y,C.x-B.x)-Math.atan2(A.y-B.y,A.x-B.x))*180/Math.PI);return x>180?360-x:x}
function visibleSide(L,ids){const sides=[ids,ids.map(x=>x%2===1?x+1:x-1)];return sides.sort((a,b)=>b.reduce((v,i)=>v+(L[i]?.visibility??0),0)-a.reduce((v,i)=>v+(L[i]?.visibility??0),0))[0]}
function measure(L,type){if(type==='lunge'){const sides=[[23,25,27],[24,26,28]].map(ids=>({value:landmarkAngle(L,...ids),visibility:ids.reduce((v,i)=>v+(L[i]?.visibility??0),0)/3})).filter(x=>x.visibility>=.55&&Number.isFinite(x.value));return sides.length?sides.reduce((a,b)=>a.value<b.value?a:b):{value:NaN,visibility:0}}let ids=type==='squat'?[23,25,27]:type==='hinge'||type==='bridge'?[11,23,25]:[11,13,15];ids=visibleSide(L,ids);return {value:landmarkAngle(L,...ids),visibility:ids.reduce((v,i)=>v+(L[i]?.visibility??0),0)/3}}
function basicWarning(L,type){if(type==='squat'){const s=visibleSide(L,[11,23,25]);const A=L[s[0]],B=L[s[1]];if(A&&B){const lean=Math.abs(Math.atan2((A.x-B.x)*aspect,B.y-A.y)*180/Math.PI);if(lean>65)return 'Revisa la inclinación del tronco.'}}
 if(type==='push'){const s=visibleSide(L,[11,23,27]);if(s.every(i=>(L[i]?.visibility??0)>.6)){const a=landmarkAngle(L,...s);if(a<140)return 'Revisa la alineación del cuerpo.'}}return ''}
const CAM_SPEC={lunge:{lo:125,hi:155,start:'hi'},squat:{lo:110,hi:155,start:'hi'},hinge:{lo:120,hi:160,start:'hi'},bridge:{lo:140,hi:165,start:'lo'},row:{lo:105,hi:155,start:'hi'},curl:{lo:80,hi:150,start:'hi'},push:{lo:100,hi:155,start:'hi'},press:{lo:100,hi:155,start:'lo'}};
const CONNECTORS=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function processPose(L,j=0){if(!training||!slot(j))return;const e=training.list[training.idx],c=slot(j).current;if(!e.cam||c.target.kind!=='reps')return;const spec=CAM_SPEC[e.cam],m=measure(L,e.cam);c.lastSeen=performance.now();if(!spec||!Number.isFinite(m.value)||m.visibility<.55){setCamStatus('Ajusta la cámara: el movimiento o las articulaciones no se ven claramente.');resetDetection(c);return}
 c.smoothed=c.smoothed===null?m.value:.55*c.smoothed+.45*m.value;const phase=c.smoothed>spec.hi?'hi':c.smoothed<spec.lo?'lo':c.phase;const tip=basicWarning(L,e.cam);if(tip&&(c.reached||c.phase&&c.phase!==spec.start))c.phaseBad=true;setCamStatus(tip||'Persona detectada · completa el recorrido para sumar una repetición.');
 if(phase&&phase!==c.phase){if(phase===spec.start){if(c.armed&&c.reached){if(!c.phaseBad)countRep(1,'camera',j);else setCamStatus('Se detectó una alerta básica. Revisa tu postura y repite.');c.reached=false;c.phaseBad=false}c.armed=true}else if(c.armed)c.reached=true;c.phase=phase}}
function displayX(x){return (cameraMirrored?1-x:x)}
function drawPose(cx,L,canvas,j){const W=canvas.width,H=canvas.height,X=i=>displayX(L[i].x)*W,Y=i=>L[i].y*H;cx.strokeStyle=j?'#78d9f7':'#b7eb69';cx.fillStyle=j?'#b6ecff':'#d7ff9c';cx.lineWidth=Math.max(3,W/220);cx.lineCap='round';CONNECTORS.forEach(([a,b])=>{if((L[a]?.visibility??0)<.35||(L[b]?.visibility??0)<.35)return;cx.beginPath();cx.moveTo(X(a),Y(a));cx.lineTo(X(b),Y(b));cx.stroke()});[11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>{if((L[i]?.visibility??0)<.35)return;cx.beginPath();cx.arc(X(i),Y(i),Math.max(3,W/250),0,Math.PI*2);cx.fill()});
 const person=slot(j),head=(L[0]&&(L[0].visibility??1)>.25)?L[0]:{x:((L[11]?.x??.5)+(L[12]?.x??.5))/2,y:Math.max(.03,Math.min(L[11]?.y??.3,L[12]?.y??.3)-.12)};const label=`${person.name} · ${person.current.cameraReps} rep. cámara`;const font=Math.max(14,Math.round(W/33)),pad=Math.max(7,W/90);cx.font=`700 ${font}px system-ui, sans-serif`;const labelW=Math.min(W-8,cx.measureText(label).width+pad*2),labelH=font+pad;const left=Math.max(4,Math.min(W-labelW-4,displayX(head.x)*W-labelW/2));const top=Math.max(4,Math.min(H-labelH-4,head.y*H-labelH-pad));cx.fillStyle='rgba(10,36,25,.88)';cx.fillRect(left,top,labelW,labelH);cx.fillStyle='#ffffff';cx.textBaseline='middle';cx.fillText(label,left+pad,top+labelH/2,labelW-2*pad)}
function cameraLoop(){if(!cameraRunning||!trackingReady||!training||!landmarker)return;const v=$('#video'),canvas=$('#canvas'),now=performance.now();if(v&&canvas&&v.readyState>=2&&v.videoWidth&&v.videoHeight&&v.currentTime!==lastFrame&&now-lastInferenceAt>=75){lastFrame=v.currentTime;lastInferenceAt=now;try{if(canvas.width!==v.videoWidth||canvas.height!==v.videoHeight){canvas.width=v.videoWidth;canvas.height=v.videoHeight;aspect=v.videoWidth/v.videoHeight;$('#cameraBox')?.style.setProperty('--camera-ratio',`${v.videoWidth}/${v.videoHeight}`)}const cx=canvas.getContext('2d');cx.clearRect(0,0,canvas.width,canvas.height);const out=landmarker.detectForVideo(v,now),poses=out.landmarks||[];if(poses.length){const mapped=poses.map(L=>({L,screenX:displayX(((L[23]?.x??.5)+(L[24]?.x??.5))/2)}));if(training.partner&&mapped.length>1&&mapped.every(x=>x.screenX<.5) || training.partner&&mapped.length>1&&mapped.every(x=>x.screenX>=.5)){setCamStatus('Sepárense: una persona debe verse a cada lado de la imagen.');resetDetection(training.current);resetDetection(training.partner.current)}else mapped.forEach(({L,screenX})=>{const j=training.partner?(screenX<.5?0:1):0;processPose(L,j);drawPose(cx,L,canvas,j)})}else{setCamStatus('Todavía no se detecta una persona. Revisa la distancia y la iluminación.')}
 for(const j of training.partner?[0,1]:[0]){const c=slot(j).current;if(c.lastSeen&&now-c.lastSeen>1200)resetDetection(c)}
 }catch(err){trackingReady=false;if(cameraFrame)cancelAnimationFrame(cameraFrame);cameraFrame=0;if(modelDelegate==='GPU'){setCamStatus('Ajustando el seguimiento para este celular.');startTracking(cameraToken,true)}else{setCamStatus('El seguimiento se detuvo. La cámara sigue encendida; pulsa «Reintentar seguimiento».');if($('#retryTracker')){$('#retryTracker').hidden=false;$('#retryTracker').disabled=false;$('#retryTracker').textContent='Reintentar seguimiento'}}return}}
 cameraFrame=requestAnimationFrame(cameraLoop)}

$$('.navbtn').forEach(b=>b.onclick=()=>{if(!state)return;const page=b.dataset.page;if(page==='plan')renderPlan();else if(page==='progress')renderProgress();else if(page==='devices')renderDevices();else renderProfile()});
$('#person').onchange=e=>{if(!state)return;state.active=e.target.value;selected='A';persist();updatePerson();if(currentPage==='progress')renderProgress();else if(currentPage==='devices')renderDevices();else if(currentPage==='profile')renderProfile();else renderPlan()};
window.addEventListener('beforeunload',()=>{timerStop(0);timerStop(1);stopActiveClock(0);stopActiveClock(1);if(stream)stream.getTracks().forEach(t=>t.stop())});
migrate();if(state?.people?.length){updatePerson();renderPlan()}else startSetup();
</script>
